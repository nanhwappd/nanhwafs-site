    <h1>今天联课处开始启动 6 项活动</h1>
    <time datetime="2020-09-12">2020-09-12</time>
    <div class="body">
      <p>今天联课处开始启动 6 项活动。有：华乐、醒狮、24 节令鼓、舞蹈、管乐和烹饪。</p>
      <p>此外校方也安排了折纸教学、禅绕画及认识马来西亚的活动，让学生参与。</p>
