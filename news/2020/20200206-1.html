    <div class="body">
      <p>06/02/2020</p>
      <p>昨天我校华乐团、二十四节令鼓、舞蹈团、醒狮团及管乐队受邀到红土坎的 Vale 国际矿务公司进行新春表演，备受欢迎。感谢上述团员的努力付出，以及本校老师和教练的努力栽培。</p>
