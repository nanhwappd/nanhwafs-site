    <h1>南华独中校长室启</h1>
    <time datetime="2018-01-12">2018-01-12</time>
    <div class="body">
      <p>南华独中校长室启。致：全体家长留意。感恩本校董事局诚意邀请知名Joey导师为全体师生进行两年的Guide Plan Support (GPS)工作坊。从中建立自我认同及自信心。应用思维转化系统以全脑极速学习，利用互动游戏以助学生开发左右脑，让他们拥有最大的正面影响及积极地学习动力。</p>
