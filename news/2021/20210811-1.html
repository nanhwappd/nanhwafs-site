    <h1>在这新冠肺炎疫情肆虐的环境下，我国适逢独立国庆月</h1>
    <time datetime="2021-08-11">2021-08-11</time>
    <div class="body">
      <p>在这新冠肺炎疫情肆虐的环境下，我国适逢独立国庆月，南华独中联课处主办了以“疫情”为主题的国庆独立日海报设计比赛，宗旨是让师生们去感受在这不“疫”样的艰苦环境下，一起共体时艰，勇敢面对病毒；除了提升师生的美术水平之余，也期待培养孩子们感恩前线人员，关怀祖国的爱国情操。</p>
